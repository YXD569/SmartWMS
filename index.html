<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智联仓储管理系统 SmartWMS</title>
  <style>
    /* 首屏骨架：避免白屏，等 JS 接管后由 App.vue 卸载 */
    html, body, #app { height: 100%; margin: 0; }
    body { background: #f0f2f5; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; }
    #boot-loading { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 14px; color: #303133; }
    #boot-loading .logo { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
    #boot-loading .bar { width: 140px; height: 3px; background: #e4e7ed; border-radius: 2px; overflow: hidden; }
    #boot-loading .bar i { display: block; width: 40%; height: 100%; background: #409eff; animation: boot 1.1s ease-in-out infinite; }
    @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-loading">
      <div class="logo">SmartWMS</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
