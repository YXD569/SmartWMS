# SmartWMS 生产环境 Nginx 配置
# 用法：cp deploy/nginx.conf /etc/nginx/conf.d/smartwms.conf && nginx -s reload

upstream smartwms_api {
    server 127.0.0.1:48081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源：带 hash 的资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # history 模式路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代
    location /api/ {
        proxy_pass http://smartwms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # SSE（AI 流式对话）：关闭缓冲，否则流式会被攒成一坨一次性返回
    location /api/ai/chat {
        proxy_pass http://smartwms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # WebSocket（大屏实时流水）
    location /api/screen/flow {
        proxy_pass http://smartwms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
